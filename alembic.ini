# Alembic configuration.
#
# NOTE: keep this file ASCII-only. configparser reads alembic.ini using the
# platform locale encoding (GBK on this machine), so non-ASCII comments here
# would raise UnicodeDecodeError before the migration even starts.
#
# The database URL is NOT maintained here: migrations/env.py reads it from the
# application settings (.env / environment variables), so alembic.ini and .env
# can never drift apart.

[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
