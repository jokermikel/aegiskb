name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    # 跑两个版本：3.11 与 Dockerfile 一致（部署口径），3.13 贴近开发机的新版本。
    # 单一版本时一旦失败很难判断「是代码问题还是某个解释器版本的问题」，
    # 矩阵能让失败直接归因到具体版本。
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    name: check (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    env:
      # CI 必须完全离线：清空密钥，强制使用离线向量后端，保证结果可复现。
      DASHSCOPE_API_KEY: ""
      EMBEDDING_PROVIDER: offline
      JWT_SECRET: ci-secret
      DATABASE_URL: sqlite:///./test_aegiskb.db

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 代码检查（ruff）
        run: ruff check .

      - name: 数据库迁移可执行且与模型一致
        env:
          DATABASE_URL: sqlite:///./ci_autogen.db
        run: |
          alembic upgrade head
          alembic check

      - name: 单元测试
        run: |
          set +e
          pytest -q -rEf --tb=short 2>&1 | tee pytest-output.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            # 把失败用例发成注解：公开仓库下无需登录即可通过 Checks API 读到，
            # 而完整 job 日志的下载接口需要仓库管理员权限，排查时很被动。
            # 必须同时收 ERROR：退出码 2 表示收集阶段出错，而 -rf 不会显示它。
            detail=$(grep -E '^(FAILED|ERROR)' pytest-output.log | head -6 | paste -sd '|' -)
            if [ -z "$detail" ]; then
              detail=$(tail -12 pytest-output.log | paste -sd '|' -)
            fi
            echo "::error::exit=${status} ${detail}"
          fi
          exit "$status"

      - name: 离线检索评测质量闸门
        run: python scripts/run_eval.py --top-k 4
