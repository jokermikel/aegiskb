services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: aegiskb
      POSTGRES_USER: aegis
      POSTGRES_PASSWORD: aegis-local-only
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegis -d aegiskb"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://aegis:aegis-local-only@db:5432/aegiskb
      JWT_SECRET: local-demo-change-me
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      DASHSCOPE_BASE_URL: ${DASHSCOPE_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      QWEN_MODEL: ${QWEN_MODEL:-qwen3.8-max}
      QWEN_REASONING_EFFORT: ${QWEN_REASONING_EFFORT:-none}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-auto}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-v4}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-1024}
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-10}
      RETRIEVAL_MIN_SCORE: ${RETRIEVAL_MIN_SCORE:-}
      RETRIEVAL_MODE: ${RETRIEVAL_MODE:-hybrid}
      RETRIEVAL_CANDIDATE_MULTIPLIER: ${RETRIEVAL_CANDIDATE_MULTIPLIER:-5}
      RETRIEVAL_RRF_K: ${RETRIEVAL_RRF_K:-60}
      RETRIEVAL_VECTOR_WEIGHT: ${RETRIEVAL_VECTOR_WEIGHT:-1.0}
      RETRIEVAL_KEYWORD_WEIGHT: ${RETRIEVAL_KEYWORD_WEIGHT:-1.0}
      RETRIEVAL_RERANK_KEYWORD_BOOST: ${RETRIEVAL_RERANK_KEYWORD_BOOST:-0.01}
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
